@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function fmt(n){n=Math.max(0,n);if(n<10&&n%1)return (Math.floor(n*10)/10).toString();if(n<1000)return Math.floor(n).toString();if(n<1e6)return (n/1000).toFixed(1).replace('.0','')+'k';return (n/1e6).toFixed(1).replace('.0','')+'M'}

  for(let i=0;i<N*N;i++){const[r,c]=rc(i);if(Math.abs(r-CC)<=1&&Math.abs(c-CC)<=1)owned[i]=true}

function remap9(b){if(!b.owned||b.owned.length!==81)return b;const mv=i=>(Math.floor(i/9)+3)*N+(i%9)+3;
  const o=Array(N*N).fill(false),g=Array(N*N).fill(null),cl=[];b.owned.forEach((v,i)=>{o[mv(i)]=v});b.grid.forEach((v,i)=>{g[mv(i)]=v});(b.cloud||[]).forEach((v,i)=>{if(v)cl[mv(i)]=true});

function randSpot(i){const[r,c]=rc(i),a=Math.random()*Math.PI*2;return[(c-CC)*T+Math.cos(a)*1.85,(r-CC)*T+Math.sin(a)*1.85]}
function spawnWorkers(k){const b=state.bases[k],st=status(k),own=b.owned.map((o,i)=>o?i:-1).filter(i=>i>=0);
  for(let j=0;j<Math.min(12,st.pop);j++){const g=makePerson({shirt:SHIRTS[(j*3+2)%8],hair:HAIRS[(j*5+1)%8],skin:SKINS[(j*2+1)%6],pants:[0x3b5ba5,0x5a4636,0x2f2f2f][j%3],gear:GEAR[k]});
    g.scale.setScalar(.9);const t=st.staffed[j]??own[Math.floor(Math.random()*own.length)],[x,z]=randSpot(t);g.position.set(x,0,z);world.add(g);

      ...(job!=null?(()=>{const[r,c]=rc(job);return{tx:(c-CC)*T,tz:(r-CC)*T+2.05,wait:0}})():{})})}}
function helperThink(w,dt){const b=state.bases[view];
  if(w.node!=null&&!b.nodes[w.node])w.node=null;
  if(w.node==null){let best=null,bd=1e9;for(const i in b.nodes){const n=workers.filter(o=>o!==w&&o.node===+i).length;if(n>=2)continue;
      const[r,c]=rc(+i),d=Math.hypot((c-CC)*T-w.x,(r-CC)*T-w.z)+n*6;if(d<bd){bd=d;best=+i}}
    if(best==null)return false;w.node=best;const[r,c]=rc(best),cx=(c-CC)*T,cz=(r-CC)*T,a=Math.atan2(w.x-cx,w.z-cz);w.tx=cx+Math.sin(a)*1.6;w.tz=cz+Math.cos(a)*1.6;w.wait=0}
  const d=Math.hypot(w.tx-w.x,w.tz-w.z);
  if(d>.1){const s=Math.min(d,1.6*dt);w.x+=(w.tx-w.x)/d*s;w.z+=(w.tz-w.z)/d*s;w.g.rotation.y=Math.atan2(w.tx-w.x,w.tz-w.z);w.moving=true;return true}
  w.moving=false;const[r,c]=rc(w.node);w.g.rotation.y=Math.atan2((c-CC)*T-w.x,(r-CC)*T-w.z);w.working=true;
  if(status(view).hungry||NET.role==='guest')return true;
  w.hitT-=dt;if(w.hitT<=0){w.hitT=6;const nd=b.nodes[w.node],dd=NODE[nd.t];nd.hp--;state.res[dd.res]+=1;shakeT[w.node]=.3;popFx(w.node,RES[dd.res][0]);
    if(nd.hp<=0){delete b.nodes[w.node];w.node=null;setTimeout(()=>{if(state)rebuildNodes()},250)}else if(NET.role==='host')netBroadcast({t:'nodes',nodes:b.nodes,hit:w.node})}
  return true}
function clearWorld(){if(!world)return;nodeGroup=null;nodeMeshes={};fx=[];scene.remove(world);world.traverse(o=>{if(o.isSprite)o.material.dispose();if(o.isPoints){o.geometry.dispose()}});world=null;anims=[];workers=[]}

function tileAt(x,z){const c=Math.round(x/T)+CC,r=Math.round(z/T)+CC;if(c<0||r<0||c>=N||r>=N)return -1;return r*N+c}
function walkable(x,z){const b=state.bases[view];
  for(const [dx,dz] of [[-.35,-.35],[.35,-.35],[-.35,.35],[.35,.35]]){const t=tileAt(x+dx,z+dz);if(t<0||!b.owned[t])return false}
  const t=tileAt(x,z),k=b.grid[t];if(b.nodes&&b.nodes[t]){const[r,c]=rc(t);if(Math.hypot(x-(c-CC)*T,z-(r-CC)*T)<1.25)return false}if(k){const[r,c]=rc(t);if(Math.hypot(x-(c-CC)*T,z-(r-CC)*T)<1.75)return false}return true}
function placeHero(pref){const b=state.bases[view],order=[pref,...b.owned.map((o,i)=>o?i:-1).filter(i=>i>=0&&i!==pref)];
  for(const t of order){if(t<0||!b.owned[t])continue;const[r,c]=rc(t),x=(c-CC)*T,z=(r-CC)*T;
    for(const [dx,dz] of [[0,0],[0,1.9],[1.9,0],[-1.9,0],[0,-1.9],[1.9,1.9],[-1.9,1.9]])if(walkable(x+dx,z+dz)){P.x=x+dx;P.z=z+dz;if(hero)hero.position.set(P.x,0,P.z);return}}}
function lerpA(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t}

function setupTouch(){
  const tz=document.getElementById('touch'),jy=document.getElementById('joy'),kn=jy.firstChild;
  tz.addEventListener('pointerdown',e=>{e.preventDefault();try{window.focus()}catch(_){}
    if(e.clientX<window.innerWidth*.5&&joy.id==null){joy.id=e.pointerId;joy.x0=e.clientX;joy.y0=e.clientY;joy.dx=joy.dy=0;jy.style.left=e.clientX+'px';jy.style.top=e.clientY+'px';jy.style.display='block';kn.style.transform=''}
    else if(look.id==null){look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY}
    try{tz.setPointerCapture(e.pointerId)}catch(_){}});
  tz.addEventListener('pointermove',e=>{
    if(e.pointerId===joy.id){let dx=e.clientX-joy.x0,dy=e.clientY-joy.y0;const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}joy.dx=dx/m;joy.dy=dy/m;kn.style.transform=`translate(${dx}px,${dy}px)`}
    else if(e.pointerId===look.id){camYaw-=(e.clientX-look.x)*.008;camPitch=Math.max(.12,Math.min(1.1,camPitch+(e.clientY-look.y)*.004));look.x=e.clientX;look.y=e.clientY}});
  const end=e=>{if(e.pointerId===joy.id){joy.id=null;joy.dx=joy.dy=0;jy.style.display='none'}if(e.pointerId===look.id)look.id=null};
  tz.addEventListener('pointerup',end);tz.addEventListener('pointercancel',end);
  window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
    if(k==='escape'&&sheet!=null){sheet=null;renaming=false;renderSheet();return}
    if((k==='e'||k===' '||k==='enter')&&!e.repeat&&sheet==null&&state){e.preventDefault();const bt=document.getElementById('act');act('act',bt.dataset.v||'');return}
    if(k.startsWith('arrow')||k===' ')e.preventDefault();keys[k]=true});
  window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
  window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.id=null;joy.dx=joy.dy=0;jy.style.display='none'});
}
function loop(now){
  requestAnimationFrame(loop);
  if(!state||!world||!hero)return;
  const t=now/1000,dt=Math.min(.05,lastT?t-lastT:0);lastT=t;
  let ix=joy.dx,iy=joy.dy;
  if(keys.w||keys.arrowup)iy=-1;if(keys.s||keys.arrowdown)iy=1;if(keys.a)ix=-1;if(keys.d)ix=1;
  if(keys.arrowleft)camYaw+=dt*2;if(keys.arrowright)camYaw-=dt*2;
  const len=Math.min(1,Math.hypot(ix,iy)),moving=len>.15&&sheet==null;
  if(moving){const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
    let mx=fx*-iy+rx*ix,mz=fz*-iy+rz*ix;const l=Math.hypot(mx,mz);mx/=l;mz/=l;
    const sp=5*len,nx=P.x+mx*sp*dt,nz=P.z+mz*sp*dt;if(walkable(nx,P.z))P.x=nx;if(walkable(P.x,nz))P.z=nz;
    P.a=lerpA(P.a,Math.atan2(mx,mz),Math.min(1,dt*12));
    if(!moved){moved=true;document.getElementById('hint').style.display='none'}}
  hero.position.set(P.x,0,P.z);hero.rotation.y=P.a;animPerson(hero,t,moving);
  for(const w of workers){w.working=false;w.moving=false;
    if(w.job!=null){const d=Math.hypot(w.tx-w.x,w.tz-w.z);if(d>.1){const s=Math.min(d,1.6*dt);w.x+=(w.tx-w.x)/d*s;w.z+=(w.tz-w.z)/d*s;w.g.rotation.y=Math.atan2(w.tx-w.x,w.tz-w.z);w.moving=true}else{w.g.rotation.y=Math.PI;w.working=true}}
    else if(!helperThink(w,dt)){
      if(w.wait>0)w.wait-=dt;
      else{const dx=w.tx-w.x,dz=w.tz-w.z,d=Math.hypot(dx,dz);
        if(d<.1){w.wait=1+Math.random()*3;const b=state.bases[view],o=[w.tile,...nbrs(w.tile).filter(j=>b.owned[j])];w.tile=o[Math.floor(Math.random()*o.length)];[w.tx,w.tz]=randSpot(w.tile)}
        else{const s=Math.min(d,1.6*dt);w.x+=dx/d*s;w.z+=dz/d*s;w.g.rotation.y=Math.atan2(dx,dz);w.moving=true}}}
    w.g.position.set(w.x,0,w.z);animPerson(w.g,t+(w.tile||0),w.moving);
    if(w.working)w.g.userData.armR.rotation.x=-1.6*Math.abs(Math.sin(t*3+w.x))}
  for(const f of anims)f(t);
  if(swingT>0){swingT-=dt;hero.userData.armR.rotation.x=-2.2*Math.sin((1-swingT/.3)*Math.PI)}
  for(const i in shakeT){const m=nodeMeshes[i];shakeT[i]-=dt;if(m)m.rotation.z=shakeT[i]>0?Math.sin(shakeT[i]*60)*.08:0;if(shakeT[i]<=0)delete shakeT[i]}
  fx=fx.filter(f=>{f.life-=dt;f.s.position.y+=dt*1.5;f.s.material.opacity=Math.max(0,f.life);if(f.life<=0){world.remove(f.s);f.s.material.dispose();return false}return true});
  lantern.position.set(P.x,3,P.z);
  const D=6.5,tx=P.x+Math.sin(camYaw)*Math.cos(camPitch)*D,tz=P.z+Math.cos(camYaw)*Math.cos(camPitch)*D,ty=1.4+Math.sin(camPitch)*D;
  cam.position.x+=(tx-cam.position.x)*Math.min(1,dt*8);cam.position.y+=(ty-cam.position.y)*Math.min(1,dt*8);cam.position.z+=(tz-cam.position.z)*Math.min(1,dt*8);
  if(view==='mine')cam.position.y=Math.min(cam.position.y,8.5);
  cam.lookAt(P.x,1.4,P.z);
  netFrame(t,dt,moving);updateAct();R.render(scene,cam)}
function updateAct(){

  if(fi>=0&&fi!==ci&&!b.owned[fi]&&canClaim(view,fi))a=['buy',fi];
  else if(fi>=0&&b.owned[fi]&&b.nodes&&b.nodes[fi])a=['hit',fi];
  else if(ci>=0&&b.nodes&&b.nodes[ci])a=['hit',ci];
  else if(fi>=0&&b.owned[fi]&&b.grid[fi])a=['look',fi];
  else if(ci>=0&&b.owned[ci]&&b.grid[ci])a=['look',ci];
  else if(ci>=0&&b.owned[ci])a=['build',ci];

  const key=a?a.join(':')+label:'';
  if(key!==curAct){curAct=key;btn.innerHTML=label;btn.style.display=a?'':'none';btn.dataset.v=a?a[1]:'';btn.dataset.t=a?a[0]:''}
  if(a){const[r,c]=rc(a[1]);hl.visible=true;hl.position.set((c-CC)*T,(a[0]==='buy'&&view==='mine')?WALL+.05:a[0]==='buy'&&view==='sky'?-.6:.05,(r-CC)*T)}else hl.visible=false}

let peerLoad=null;
function loadPeer(){if(window.Peer)return Promise.resolve();if(peerLoad)return peerLoad;
  const urls=['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
  peerLoad=new Promise((res,rej)=>{let i=0;const next=()=>{if(i>=urls.length){rej();return}const sc=document.createElement('script');sc.src=urls[i++];sc.onload=()=>window.Peer?res():next();sc.onerror=next;document.head.appendChild(sc)};next()});
  return peerLoad}
function netStart(name,userPicked){
  loadPeer().then(()=>{
    const old=NET.peer;NET.peer=null;if(old){try{old.destroy()}catch(e){}}
    NET.status='connecting';updNetUI();
    let peer;try{peer=new Peer(peerId(name),window.PEEROPTS||{debug:0})}catch(e){NET.status='blocked';updNetUI();return}
    NET.peer=peer;
    peer.on('open',()=>{if(NET.peer!==peer)return;NET.me=name;NET.status='online';try{localStorage.setItem('bx-username',name)}catch(e){}updNetUI()});
    peer.on('error',e=>{if(NET.peer!==peer)return;
      if(e.type==='unavailable-id'){if(userPicked){toast('😕 Someone online is already '+name+'. Pick another!');netStart(NET.me&&NET.me.toLowerCase()!==name.toLowerCase()?NET.me:randName(),false)}else netStart(randName(),false)}
      else if(e.type==='peer-unavailable')toast('😕 Nobody with that username is online right now.');
      else if(['network','server-error','socket-error','socket-closed','browser-incompatible','ssl-unavailable'].includes(e.type)){NET.status='blocked';updNetUI()}});
    peer.on('disconnected',()=>{if(NET.peer!==peer)return;NET.status='connecting';updNetUI();setTimeout(()=>{try{if(NET.peer===peer&&!peer.destroyed&&peer.disconnected)peer.reconnect()}catch(e){}},1000)});
    peer.on('connection',c=>{c.on('data',d=>netData(c,d));c.on('close',()=>netClosed(c));
      c.on('open',()=>{const md=c.metadata||{};if(md.kind==='invite'){
        if(NET.role||NET.pend){c.send({t:'busy'});setTimeout(()=>c.close(),300);return}
        NET.pend={c,from:md.from};showInvite(md.from)}})});
  }).catch(()=>{NET.status='blocked';updNetUI()})}
function netWake(){if(!NET.me&&!NET.peer)return;const p=NET.peer;
  if(p&&!p.destroyed&&p.disconnected){try{p.reconnect()}catch(e){netStart(NET.me,false)}}else if(!p||p.destroyed)netStart(NET.me||randName(),false)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(netWake,400)});
function updNetUI(){if(!state)renderMain();if(sheet==='friends'&&!document.activeElement?.matches?.('input'))renderSheet()}
function netSend(c,m){try{if(c&&c.open)c.send(m)}catch(e){}}
function netBroadcast(m,except){for(const id in NET.guests)if(id!==except)netSend(NET.guests[id].c,m)}
function worldMsg(){return{t:'world',view,base:state.bases[view],title:title(view),res:state.res,main:state.main}}
function netInvite(name){name=(name||'').trim();
  if(!okName(name)){toast('Usernames are 3 to 16 letters or numbers');return}
  if(NET.status!=='online'){toast('You’re not online yet');return}
  if(name.toLowerCase()===NET.me.toLowerCase()){toast('That’s you! 😄');return}
  if(NET.role==='guest'){toast('Only the world owner can invite');return}
  if(Object.keys(NET.guests).length>=5){toast('Your world is full (5 friends max)');return}
  const c=NET.peer.connect(peerId(name),{metadata:{kind:'invite',from:NET.me},reliable:true});
  c.on('data',d=>netData(c,d));c.on('close',()=>netClosed(c));
  c.on('open',()=>toast('📨 Invite sent to '+name+'!'))}
function showInvite(from){const el=document.getElementById('invpop');
  el.innerHTML=`<div class="invbox"><div style="font-size:40px">📨</div><b>${esc(from)} invited you to their world!</b><div class="eff">Only join people you know.</div><div class="invbtns"><button class="go" data-a="invyes">Join!</button><button class="go dim" data-a="invno">No thanks</button></div></div>`;el.className='on'}
function hideInvite(){const el=document.getElementById('invpop');el.className='';el.innerHTML=''}
function netData(c,d){if(!d||!d.t)return;
  // ---- messages the host gets ----
  if(d.t==='join'){if(NET.role==='guest'||!state){netSend(c,{t:'gone'});return}
    if(Object.keys(NET.guests).length>=5){netSend(c,{t:'full'});setTimeout(()=>c.close(),300);return}
    NET.role='host';NET.guests[c.peer]={c,name:String(d.name||'Friend').slice(0,14),user:String(d.user||'').slice(0,16),look:d.look||{shirt:0,hair:0,skin:0},x:P.x,z:P.z,a:0,m:0};
    netSend(c,{...worldMsg(),t:'welcome',host:NET.me});toast(`🎉 ${NET.guests[c.peer].name} joined your world!`);renderHud();if(sheet==='friends')renderSheet();return}
  if(d.t==='no'){toast('😶 They said no thanks.');c.close();return}
  if(d.t==='busy'){toast('⏳ They’re busy right now. Try again later!');return}
  if(d.t==='me'&&NET.guests[c.peer]){Object.assign(NET.guests[c.peer],{x:+d.x||0,z:+d.z||0,a:+d.a||0,m:d.m?1:0,look:d.look||NET.guests[c.peer].look});return}
  if(d.t==='hit'&&NET.role==='host'){hostHit(+d.i);return}
  if(d.t==='emote'){const id=NET.role==='host'?c.peer:d.id;showEmote(id,d.text);if(NET.role==='host')netBroadcast({t:'emote',id:c.peer,text:d.text},c.peer);return}
  // ---- messages the guest gets ----
  if(d.t==='welcome'){NET.role='guest';NET.host=c;NET.hostName=d.host;if(state&&slot!=null)save();
    state={res:d.res,bases:{[d.view]:d.base},main:d.main,hero:{...NET.look},stamina:100,t:Date.now()};slot=null;sheet=null;
    if(!init3D())return;render();goBase(d.view);resize();toast(`🌍 Welcome to ${d.host}’s world!`);return}
  if(NET.role!=='guest'||c!==NET.host)return;
  if(d.t==='world'){const same=d.view===view;state.bases={[d.view]:d.base};state.res=d.res;state.main=d.main;
    if(same){const px=P.x,pz=P.z;buildWorld();if(walkable(px,pz)){P.x=px;P.z=pz}else placeHero(tileAt(px,pz))}else goBase(d.view);renderMain();return}
  if(d.t==='nodes'){const b=state.bases[view];const before=Object.keys(b.nodes||{}).length;b.nodes=d.nodes||{};if(d.hit!=null){shakeT[d.hit]=.3}
    if(Object.keys(b.nodes).length!==before)rebuildNodes();return}
  if(d.t==='res'){state.res=d.res;renderTop();return}
  if(d.t==='pos'){const seen={};for(const r of d.list||[]){if(r.id===NET.peer.id)continue;seen[r.id]=1;const o=NET.remotes[r.id]||(NET.remotes[r.id]={g:null,x:r.x,z:r.z,a:r.a});Object.assign(o,{tx:r.x,tz:r.z,ta:r.a,m:r.m,name:r.name,look:r.look})}
    for(const id in NET.remotes)if(!seen[id])dropRemote(id);return}
  if(d.t==='kick'){leaveVisit('🏠 The world owner sent you home.');return}
  if(d.t==='full'){toast('That world is full right now.');return}
}
function netClosed(c){
  if(NET.role==='host'&&NET.guests[c.peer]){const n=NET.guests[c.peer].name;delete NET.guests[c.peer];dropRemote(c.peer);toast(`👋 ${n} left`);if(!Object.keys(NET.guests).length)NET.role=null;renderHud();if(sheet==='friends')renderSheet();return}
  if(NET.role==='guest'&&c===NET.host){leaveVisit('🔌 You got disconnected from the world.');return}
  if(NET.pend&&NET.pend.c===c){NET.pend=null;hideInvite()}}
function leaveVisit(msg){if(NET.role!=='guest')return;const h=NET.host;NET.role=null;NET.host=null;try{h&&h.close()}catch(e){}
  for(const id in NET.remotes)dropRemote(id);state=null;slot=null;sheet=null;clearWorld();hero=null;render();if(msg)toast(msg)}
function netEndHost(){if(NET.role!=='host')return;netBroadcast({t:'kick'});for(const id in NET.guests){const c=NET.guests[id].c;setTimeout(()=>{try{c.close()}catch(e){}},300)}NET.guests={};NET.role=null;for(const id in NET.remotes)dropRemote(id)}
function kickGuest(id){const g=NET.guests[id];if(!g)return;netSend(g.c,{t:'kick'});setTimeout(()=>{try{g.c.close()}catch(e){}},300)}
function hostHit(i){const b=state.bases[view],nd=b.nodes&&b.nodes[i];if(!nd)return;const dd=NODE[nd.t];nd.hp--;state.res[dd.res]+=HITGAIN;shakeT[i]=.3;popFx(i,RES[dd.res][0]);
  if(nd.hp<=0){delete b.nodes[i];setTimeout(()=>{if(state)rebuildNodes()},250)}else netBroadcast({t:'nodes',nodes:b.nodes,hit:i});renderTop()}
function tagTex(text){const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');x.font='bold 46px "Baloo 2",system-ui,sans-serif';
  const w=Math.min(500,x.measureText(text).width+40);x.fillStyle='rgba(0,0,0,.55)';x.beginPath();x.roundRect?x.roundRect(256-w/2,14,w,68,30):x.rect(256-w/2,14,w,68);x.fill();
  x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,50);return new THREE.CanvasTexture(c)}
function bubbleSprite(text,bg){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.font='bold 50px "Baloo 2","Apple Color Emoji",system-ui,sans-serif';
  const w=Math.min(500,x.measureText(text).width+50);x.fillStyle=bg||'#fff';x.beginPath();x.roundRect?x.roundRect(256-w/2,10,w,90,40):x.rect(256-w/2,10,w,90);x.fill();
  x.fillStyle='#1f2a24';x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,57);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(3.2,.8,1);return s}
function remoteMesh(o){const g=makePerson({shirt:SHIRTS[o.look?.shirt|0]??SHIRTS[0],hair:HAIRS[o.look?.hair|0]??HAIRS[0],skin:SKINS[o.look?.skin|0]??SKINS[0],gear:GEAR[view]});
  const tag=new THREE.Sprite(new THREE.SpriteMaterial({map:tagTex(o.name||'Friend'),transparent:true,depthWrite:false}));tag.scale.set(2.8,.52,1);tag.position.y=2.75;g.add(tag);g.userData.tag=tag;g.userData.lookKey=JSON.stringify(o.look)+o.name;return g}
function dropRemote(id){const o=NET.remotes[id];if(o&&o.g&&world)world.remove(o.g);delete NET.remotes[id]}
let emoteFx=[];
function showEmote(id,text){if(!world)return;if(!EMOTES.includes(text))return;const s=bubbleSprite(text);world.add(s);emoteFx.push({s,id,life:3})}
function sendEmote(text){if(NET.role==='guest')netSend(NET.host,{t:'emote',text});else if(NET.role==='host')netBroadcast({t:'emote',id:'host',text});showEmote('me',text)}
function netFrame(t,dt,moving){
  if(NET.role==='host'){for(const id in NET.guests){const g=NET.guests[id],o=NET.remotes[id]||(NET.remotes[id]={g:null,x:g.x,z:g.z,a:g.a});Object.assign(o,{tx:g.x,tz:g.z,ta:g.a,m:g.m,name:g.name,look:g.look})}}
  if(t-NET.sendT>.1&&NET.role){NET.sendT=t;
    if(NET.role==='guest')netSend(NET.host,{t:'me',x:+P.x.toFixed(2),z:+P.z.toFixed(2),a:+P.a.toFixed(2),m:moving?1:0,look:state.hero});
    else{const list=[{id:'host',name:NET.me,look:state.hero,x:+P.x.toFixed(2),z:+P.z.toFixed(2),a:+P.a.toFixed(2),m:moving?1:0}];
      for(const id in NET.guests){const g=NET.guests[id];list.push({id,name:g.name,look:g.look,x:g.x,z:g.z,a:g.a,m:g.m})}netBroadcast({t:'pos',list})}}
  for(const id in NET.remotes){const o=NET.remotes[id];const key=JSON.stringify(o.look)+o.name;
    if(o.g&&o.g.userData.lookKey!==key){world.remove(o.g);o.g=null}
    if(!o.g){o.g=remoteMesh(o);o.x=o.tx??o.x;o.z=o.tz??o.z;world.add(o.g)}
    o.x+=((o.tx??o.x)-o.x)*Math.min(1,dt*10);o.z+=((o.tz??o.z)-o.z)*Math.min(1,dt*10);o.a=lerpA(o.a||0,o.ta||0,Math.min(1,dt*10));
    o.g.position.set(o.x,0,o.z);o.g.rotation.y=o.a;animPerson(o.g,t+id.length,!!o.m)}
  emoteFx=emoteFx.filter(f=>{f.life-=dt;const who=f.id==='me'?{x:P.x,z:P.z}:NET.remotes[f.id];if(who)f.s.position.set(who.x,3.5,who.z);f.s.material.opacity=Math.min(1,f.life);
    if(f.life<=0){world&&world.remove(f.s);f.s.material.map.dispose();f.s.material.dispose();return false}return true})}

  else if(s.idle)banner=`<div class="banner tip">💤 ${s.idle} building${s.idle>1?'s have':' has'} no workers. Build a house for more people!</div>`;

function mapBody(){return `<p class="blurb">Unlock more bases. You can have them all in one save!</p>`+Object.keys(BASES).map(k=>{const d=BASES[k],have=!!state.bases[k];
  const needs=d.conds.length?'Needs: '+d.conds.map(c=>COND[c].join(' ')).join(', '):'Needs nothing special';
  if(d.secret&&!have&&!allMaxed())return `<div class="card"><div class="be">❓</div><div style="flex:1"><h3>??? Secret base</h3><p>Something hot is hiding somewhere… Fill every base with max land to find it!</p><p>${Object.keys(BASES).filter(x=>!BASES[x].secret).map(x=>`${BASES[x].e}${state.bases[x]&&state.bases[x].maxed?'✅':'⬜'}`).join(' ')}</p></div></div>`;
  return `<div class="card"><div class="be">${d.e}</div><div style="flex:1"><h3>${have?esc(title(k)):d.n}</h3><p>${d.blurb}</p><p>${needs}</p>${have?`<button class="go" data-a="tab" data-v="${k}">Go there</button>`:`<div>${costHTML(d.unlock)}</div><button class="go ${canPay(d.unlock)?'':'dim'}" style="margin-top:6px" data-a="unlock" data-v="${k}">Unlock</button>`}</div></div>`}).join('')}
function heroBody(){const sw=(arr,key)=>`<div class="sws">${arr.map((c,i)=>`<button class="sw ${state.hero[key]===i?'on':''}" style="background:#${c.toString(16).padStart(6,'0')}" data-a="pickhero" data-v="${key}:${i}" aria-label="Color ${i+1}"></button>`).join('')}</div>`;
  return `<b>Shirt</b>${sw(SHIRTS,'shirt')}<b>Hair</b>${sw(HAIRS,'hair')}<b>Skin</b>${sw(SKINS,'skin')}`}
function renderSheet(){
  const el=document.getElementById('sheet');
  if(sheet==null||(!state&&sheet!=='friends'&&sheet!=='join')){el.className='';el.innerHTML='';return}
  const prevScroll=el.querySelector('.sheetbody')?.scrollTop||0;
  const k=view,b=state&&state.bases[k];let head,body;
  if(sheet==='friends'){head='👫 Friends';body=friendsBody()}
  else if(sheet==='join'){head='Who do you want to be?';body=joinBody()}
  else if(sheet==='info'){head=`${BASES[k].e} ${esc(title(k))}`;body=infoBody(k)}
  else if(sheet==='map'){head='🗺️ New bases';body=mapBody()}
  else if(sheet==='hero'){head='🎨 Change me';body=heroBody()}
  else{const x=b.grid[sheet];
    if(!b.owned[sheet]){const c=landCost(k);head='🚩 Buy this land';
      body=`<div class="row"><div class="info"><div class="eff">${k==='mine'?'Dig out more tunnel':'Make your base bigger'}! Then you can walk and build on it.</div><div>${costHTML(c)}</div></div><button class="go ${canPay(c)?'':'dim'}" data-a="claim">Buy</button></div>`}
    else if(!x&&(b.cloud||[])[sheet]){head='☁️ Walkable cloud';body=`<div class="row"><div class="info"><div class="eff">Normal buildings would fall right through, but these special cloud buildings work up here! They make about 2× as much, but need 2× the lift.</div></div></div><div class="row"><span class="e">☁️</span><div class="info"><b>Cloud</b><div class="eff">Turn it off to make it land again</div></div><button class="tog on" data-a="toland" aria-label="Cloud is on"><i></i></button></div>${BASES[k].cloudList.map(bk=>{const c=costOf(k,bk);return `<div class="row"><span class="e">${B[bk].e}</span><div class="info"><b>${B[bk].n}</b><div class="eff">${effects(bk)}</div><div>${costHTML(c)}</div></div><button class="go ${canPay(c)?'':'dim'}" data-a="build" data-v="${bk}">Build</button></div>`}).join('')}`}
    else if(!x){head='🔨 Build here';
      body=(k==='sky'?`<div class="row"><span class="e">☁️</span><div class="info"><b>Cloud</b><div class="eff">Turn this spot into a fluffy cloud you can walk on</div></div><button class="tog" data-a="tocloud" aria-label="Cloud is off"><i></i></button></div>`:'')+BASES[k].list.map(bk=>{const c=costOf(k,bk);return `<div class="row"><span class="e">${B[bk].e}</span><div class="info"><b>${B[bk].n}</b><div class="eff">${effects(bk)}</div><div>${costHTML(c)}</div></div><button class="go ${canPay(c)?'':'dim'}" data-a="build" data-v="${bk}">Build</button></div>`}).join('')}
    else{head=`${B[x].e} ${B[x].n}`;
      body=B[x].fixed?`<div class="row"><div class="info"><div class="eff">The heart of this base. It can’t be removed.${effects(x)?' It '+effects(x)+'.':''}</div></div></div>`:`<div class="row"><div class="info"><div class="eff">${effects(x)}</div><div class="eff">You have ${count(k,x)} here.</div></div></div><button class="go wide" data-a="remove">Remove it (get half back)</button>`}}
  el.className='on';
  el.innerHTML=`<div class="sheetbox"><div class="sheethead"><h2>${head}</h2><button class="x" data-a="close" aria-label="Close">✕</button></div><div class="sheetbody">${body}</div></div>`;
  el.querySelector('.sheetbody').scrollTop=prevScroll;
  if(sheet==='join'){const w=document.getElementById('wname');if(w)w.oninput=()=>NET.wname=w.value}
  if(renaming){const i=document.getElementById('nick');if(i&&document.activeElement!==i)i.focus()}}
function render(){renderMain();renderSheet()}
function goBase(k){view=k;sheet=null;renaming=false;buildWorld();placeHero(state.bases[k].me??MID+N);camYaw=0;cam.position.set(P.x,6,P.z+7)}

/* ---------- actions ---------- */
function act(a,v){
  if(a==='slot'){const i=+v;if(!init3D())return;slot=i;state=readSlot(i)||newState();
    for(const k in state.bases){if(!BASES[k])delete state.bases[k];else state.bases[k]=migrate(k,state.bases[k])}
    if(!state.hero||typeof state.hero!=='object')state.hero={shirt:1,hair:0,skin:0};if(state.stamina==null)state.stamina=100;for(const r in RES)if(state.res[r]==null)state.res[r]=0;for(const k in state.bases){if(isFull(state.bases[k]))state.bases[k].maxed=true}
    const dt=Math.min((Date.now()-state.t)/1000,7200);if(dt>30){tick(dt);toast('Your bases kept working while you were away!')}
    pendingDel=null;render();goBase(state.main);resize();save();return}
  if(a==='delslot'){const i=+v;if(pendingDel===i){try{localStorage.removeItem(KEY(i))}catch(e){}pendingDel=null;toast('Deleted Save '+(i+1))}else pendingDel=i;render();return}
  if(a==='friends'){sheet='friends';renderSheet();return}
  if(a==='close'&&!state){sheet=null;renderSheet();return}
  if(a==='uname'){const n=(document.getElementById('uname')?.value||'').trim();if(!okName(n)){toast('Use 3 to 16 letters or numbers, starting with a letter');return}if(n===NET.me)return;netStart(n,true);return}
  if(a==='unamerand'){netStart(randName(),false);return}
  if(a==='invyes'){hideInvite();if(!NET.pend)return;NET.look=state&&slot!=null?{...state.hero}:NET.look;NET.wname=NET.wname||NET.me;sheet='join';renderSheet();return}
  if(a==='invno'){hideInvite();if(NET.pend){netSend(NET.pend.c,{t:'no'});const c=NET.pend.c;setTimeout(()=>{try{c.close()}catch(e){}},300);NET.pend=null}return}
  if(a==='joinlook'){const[key,i]=v.split(':');NET.look[key]=+i;renderSheet();return}
  if(a==='joingo'){const p=NET.pend;if(!p||!p.c.open){toast('That invite expired');NET.pend=null;sheet=null;renderSheet();return}
    const n=(document.getElementById('wname')?.value||NET.me||'Friend').trim().slice(0,14)||'Friend';NET.wname=n;
    if(NET.role==='host')netEndHost();if(state&&slot!=null)save();netSend(p.c,{t:'join',name:n,user:NET.me,look:NET.look});NET.pend=null;sheet=null;renderSheet();toast('Joining…');return}
  if(a==='invite'){netInvite(document.getElementById('invname')?.value);return}
  if(a==='kick'){kickGuest(v);return}
  if(a==='leave'){leaveVisit('🏠 You went back home.');return}
  if(a==='emote'){sendEmote(EMOTES[+v]);sheet=null;renderSheet();return}
  if(!state)return;
  if(NET.role==='guest'){
    if(a==='menu'){leaveVisit('🏠 You went back home.');return}
    if(a==='pickhero'){const[key,i]=v.split(':');NET.look[key]=+i}
    if(['build','remove','claim','bigmap','claimcloud','tocloud','toland','unlock','main','rename','renamesave','tab','mapopen','snack'].includes(a)){toast('🔒 Only the world owner can do that');return}
    if(a==='act'&&document.getElementById('act').dataset.t!=='hit'){toast('🔒 Only the world owner can build and buy land');return}}
  if(a==='snack'){if(state.res.food<5){toast('You need 5 🍎 food for a snack');return}if(state.stamina>=100){toast('You’re not tired yet!');return}
    state.res.food-=5;state.stamina=Math.min(100,state.stamina+30);toast('Yum! 💪 +30');renderTop();return}
  if(a==='menu'){netEndHost();save();state=null;slot=null;sheet=null;renaming=false;clearWorld();hero=null;render();window.scrollTo(0,0);return}
  if(a==='act'){const bt=document.getElementById('act');if(v===''||Date.now()<actLock)return;if(bt.dataset.t==='hit'){doHit(+v);return}sheet=+v}
  else if(a==='info'){sheet='info'}
  else if(a==='mapopen'){sheet='map'}
  else if(a==='heropick'){sheet='hero'}
  else if(a==='pickhero'){const[key,i]=v.split(':');state.hero[key]=+i;world.remove(hero);hero=makePerson({shirt:SHIRTS[state.hero.shirt],hair:HAIRS[state.hero.hair],skin:SKINS[state.hero.skin],gear:GEAR[view]});world.add(hero)}
  else if(a==='tab'){save();goBase(v)}
  else if(a==='close'){sheet=null;renaming=false}
  else if(a==='build'){const onC=!!(state.bases[view].cloud||[])[sheet];if(!!B[v].cloud!==onC){toast(onC?'That would fall through the cloud!':'Cloud buildings only work on clouds ☁️');return}const c=costOf(view,v);if(!canPay(c)){toast('You need more '+missing(c));return}
    const t=sheet;pay(c);state.bases[view].grid[t]=v;if(state.bases[view].nodes)delete state.bases[view].nodes[t];sheet=null;toast(`Built a ${B[v].n}!`);buildWorld();if(!walkable(P.x,P.z))placeHero(t)}
  else if(a==='remove'){const b=state.bases[view],x=b.grid[sheet];if(!x||B[x].fixed)return;b.grid[sheet]=null;
    for(const r in B[x].c)state.res[r]+=Math.floor(B[x].c[r]*Math.pow(1.2,count(view,x))/2);sheet=null;toast(`Removed the ${B[x].n}`);buildWorld()}
  else if(a==='claim'){const b=state.bases[view],c=landCost(view);if(typeof sheet!=='number'||b.owned[sheet])return;if(!canPay(c)){toast('You need more '+missing(c));return}
    pay(c);b.owned[sheet]=true;if(isFull(b)&&!b.maxed){b.maxed=true;setTimeout(()=>toast(allMaxed()&&!state.bases.volcano?'🌋 Every base is full! A secret base appeared in 🗺️ New bases!':'🎉 This base is full! Open 📋 Base info to make the map bigger.'),900)}seedNodes(view);if(Math.random()<.5)spawnNode(view,sheet);sheet=null;toast(view==='mine'?'You dug out more tunnel!':'Your base got bigger!');buildWorld()}
  else if(a==='claimcloud'){const b=state.bases[view],c={coins:Math.ceil(landCost(view).coins/2)};if(typeof sheet!=='number'||b.owned[sheet])return;if(!canPay(c)){toast('You need more '+missing(c));return}
    pay(c);b.owned[sheet]=true;(b.cloud=b.cloud||[])[sheet]=true;sheet=null;toast('☁️ A new cloud!');buildWorld()}
  else if(a==='tocloud'){const b=state.bases[view];if(typeof sheet!=='number'||b.grid[sheet])return;(b.cloud=b.cloud||[])[sheet]=true;if(b.nodes)delete b.nodes[sheet];toast('☁️ Poof! It’s a cloud now');buildWorld()}
  else if(a==='toland'){const b=state.bases[view];if(typeof sheet!=='number'||!b.cloud)return;b.cloud[sheet]=false;toast('🌱 It’s land again');buildWorld()}
  else if(a==='bigmap'){const b=state.bases[view],c=mapCost(view);if(!isFull(b)||(b.size||9)>=MAXSIZE)return;if(!canPay(c)){toast('You need more '+missing(c));return}
    pay(c);b.maxed=true;b.size=(b.size||9)+2;sheet=null;toast(`🗺️ The map grew to ${b.size}×${b.size}!`);buildWorld()}
  else if(a==='unlock'){if(BASES[v].secret&&!allMaxed()){toast('🔒 Fill every base with max land first!');return}const c=BASES[v].unlock;if(!canPay(c)){toast('You need more '+missing(c));return}
    pay(c);state.bases[v]=makeBase(v);toast(`${BASES[v].n} unlocked!`);save();goBase(v)}
  else if(a==='main'){state.main=v;toast(`${title(v)} is your main base now`)}
  else if(a==='rename'){renaming=true}
  else if(a==='renamesave'){const i=document.getElementById('nick');state.bases[view].nick=(i?i.value:'').trim().slice(0,24);renaming=false}
  save();render();
}
// HUD buttons react the moment a finger touches them, even while the other thumb is on the joystick
document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-p]');if(!t)return;e.preventDefault();act(t.dataset.p,t.dataset.v)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){act(t.dataset.a,t.dataset.v);return}
  if(e.target.id==='sheet'){sheet=null;renaming=false;renderSheet()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nick')act('renamesave')});
let regrowN=0;
setInterval(()=>{if(!state)return;if(NET.role!=='guest')tick(1);state.stamina=Math.min(100,state.stamina+2);if(NET.role!=='guest'&&++regrowN%12===0)regrow();if(NET.role==='host')netBroadcast({t:'res',res:state.res});renderTop();renderHud();if(sheet!=null&&!renaming)renderSheet()},1000);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
render();
(function(){let n=null;try{n=localStorage.getItem('bx-username')}catch(e){}netStart(n&&okName(n)?n:randName(),false)})();
</script>
</body>
</html>
