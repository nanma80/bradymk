<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be a Pet! 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DDF0FF;--ink:#2E2A4F;--muted:#64708a;--card:#ffffff;--soft:#d2e4f3;--pink:#FF6F9F;--line:#bdd6ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1f2e;--ink:#F1F3FA;--muted:#a8b0c8;--card:#262c40;--soft:#323a54;--line:#3e4766}}
:root[data-theme="dark"]{--bg:#1a1f2e;--ink:#F1F3FA;--muted:#a8b0c8;--card:#262c40;--soft:#323a54;--line:#3e4766}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
input{font:inherit;-webkit-user-select:text;user-select:text}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 28px}
.screen{display:none}.screen.on{display:block}
.logo{font-size:clamp(46px,11vw,86px);font-weight:700;line-height:.95;margin:20px 0 8px;letter-spacing:-.02em}
.logo small{display:inline-block;font-size:.45em;background:var(--pink);color:#fff;border-radius:14px;padding:2px 12px;transform:rotate(-6deg) translateY(-.35em)}
.tag{color:var(--muted);font-size:20px;margin:0 0 26px;max-width:32ch}
.slots{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.slot{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px 16px;text-align:left;flex:1}
.slot .big{font-size:44px;width:56px;text-align:center}
.slot .t{font-size:22px;font-weight:600}
.slot .s{color:var(--muted);font-size:16px}
.del{font-size:15px;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--soft)}
.del.sure{background:#ff5d5d;color:#fff}
.h2{font-size:30px;font-weight:700;margin:12px 0 10px}
.stage{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:26px;overflow:hidden}
.stage canvas{flex:1;min-width:0;height:min(48vh,380px);display:block}
.arrow{font-size:44px;font-weight:700;width:64px;height:120px;color:var(--pink)}
.ptype{text-align:center;font-size:28px;font-weight:700;margin:10px 0 4px}
.breeds{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0 10px}
.br{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:8px 16px;font-size:18px;font-weight:600}
.br.on{border-color:var(--pink);background:var(--pink);color:#fff}
.colors{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:6px 0 4px}
.sw{width:50px;height:50px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--line)}
.sw.on{box-shadow:0 0 0 4px var(--pink)}
.namebox{display:flex;flex-direction:column;gap:6px;font-size:19px;font-weight:600;margin-top:16px}
.namebox input{border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-size:22px;background:var(--card);color:var(--ink);width:100%}
.go{display:block;width:100%;background:var(--pink);color:#fff;font-size:26px;font-weight:700;border-radius:22px;padding:16px;margin-top:18px;box-shadow:0 6px 0 #c94a76}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #c94a76}
.back{font-size:18px;color:var(--muted);padding:10px 0;margin-top:8px}

#game{position:fixed;inset:0;display:none;overflow:hidden;background:#BFE3FF}
#game.on{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;background:#fff;color:#2E2A4F;font-weight:600;font-size:17px;padding:7px 13px;border-radius:16px;white-space:nowrap;box-shadow:0 3px 0 rgba(46,42,79,.25);transform:translate(-50%,-100%);display:none}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.shout{background:#FFE14D;font-size:20px;font-weight:700}
.bub.pet{background:#FFD9E6}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.me{background:rgba(255,255,255,.92);color:#2E2A4F;border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 rgba(46,42,79,.18)}
.me .n{font-weight:700;font-size:20px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .s{font-size:16px;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ib{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.92);font-size:24px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(46,42,79,.18)}
.ib:active{transform:translateY(3px)}
.ctrl{position:absolute;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:12px;align-items:end;justify-items:end;pointer-events:none}
.ctrl>*{pointer-events:auto}
.cb{border-radius:50%;background:rgba(255,255,255,.92);color:#2E2A4F;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(46,42,79,.25)}
.cb span{font-size:30px;line-height:1}
.cb:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(46,42,79,.25)}
#jump{width:96px;height:96px;font-size:17px;grid-column:2;grid-row:2;background:#7FD3FF}
#meow{width:76px;height:76px;font-size:14px;grid-column:1;grid-row:2}
#action{grid-column:1/3;grid-row:1;background:var(--pink);color:#fff;font-weight:700;font-size:23px;height:66px;padding:0 24px;border-radius:24px;box-shadow:0 5px 0 #c94a76;display:none;align-items:center;gap:8px;white-space:nowrap}
#action.on{display:flex}
#action:active{transform:translateY(4px);box-shadow:0 1px 0 #c94a76}
.joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.75);pointer-events:none;display:none}
.joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(46,42,79,.25)}
.joyhint{position:absolute;left:24px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:3px dashed rgba(255,255,255,.85);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:none;transition:opacity .4s}
.joyhint.off{opacity:0}
.hint{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(46,42,79,.85);color:#fff;font-size:18px;padding:10px 18px;border-radius:18px;pointer-events:none;transition:opacity .6s;text-align:center;max-width:90%}
.hint.off{opacity:0}
.toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:#FFD45C;color:#2E2A4F;font-weight:700;font-size:20px;padding:11px 20px;border-radius:18px;box-shadow:0 5px 0 #d9a92a;transition:all .3s;z-index:20;text-align:center;max-width:92%;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.overlay{position:absolute;inset:0;background:rgba(20,18,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.on{display:flex}
.sheet{background:#fff;color:#2E2A4F;width:100%;max-width:680px;max-height:86%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.goal{display:flex;gap:12px;align-items:center;background:#f2f4fb;border-radius:18px;padding:10px 12px;margin-bottom:9px}
.goal .big{font-size:32px;width:42px;text-align:center}
.goal .t{font-weight:700;font-size:18px}
.goal .s{font-size:15px;color:#64708a}
.goal .c{margin-left:auto;font-weight:700;font-size:18px;white-space:nowrap}
.goal.done{background:#e3f7e6}
.hats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hat{background:#f2f4fb;border:3px solid transparent;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;font-size:15px;font-weight:600}
.hat .big{font-size:36px;line-height:1.15}
.hat.on{border-color:var(--pink)}
.hat:disabled{opacity:.45}
.close{display:block;width:100%;background:var(--pink);color:#fff;font-weight:700;font-size:22px;padding:14px;border-radius:18px;margin-top:12px}
@media (max-width:520px){#jump{width:84px;height:84px}#meow{width:66px;height:66px}#action{font-size:20px;height:60px}.ib{width:44px;height:44px;font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<section class="screen on" id="menu">
  <div class="logo">Be a Pet! <small>3D</small></div>
  <p class="tag">Explore the town, trip the humans, steal their snacks, and climb everything.</p>
  <div class="slots" id="slots"></div>
</section>
<section class="screen" id="pick">
  <div class="h2">Who do you want to be?</div>
  <div class="stage"><button class="arrow" id="prev" aria-label="Previous pet">‹</button><canvas id="pv"></canvas><button class="arrow" id="next" aria-label="Next pet">›</button></div>
  <div class="ptype" id="ptype"></div>
  <div class="breeds" id="breeds"></div>
  <div class="colors" id="colors"></div>
  <label class="namebox">Your name<input id="petname" maxlength="14" autocomplete="off"></label>
  <button class="go" id="start">Start exploring!</button>
  <button class="back" id="pickback">← Back</button>
</section>
</div>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="bubbles"></div>
  <div class="joy" id="joy"><i id="knob"></i></div>
  <div class="joyhint" id="joyhint">Hold here<br>to move</div>
  <div class="hint" id="hint">Left thumb: move. Right side: drag to look around.</div>
  <div class="hud">
    <div class="me"><div class="n" id="gname"></div><div class="s" id="gstat"></div></div>
    <div class="btns">
      <button class="ib" id="mbtn" aria-label="Map">🗺️</button>
      <button class="ib" id="gbtn" aria-label="Goals">📋</button>
      <button class="ib" id="hbtn" aria-label="Hats">🎩</button>
      <button class="ib" id="snd" aria-label="Sound">🔊</button>
      <button class="ib" id="home" aria-label="Save files">🏠</button>
    </div>
  </div>
  <div class="ctrl">
    <button id="action"></button>
    <button class="cb" id="meow"><span>🐾</span><b id="meowlab">Meow</b></button>
    <button class="cb" id="jump"><span>⬆️</span>Jump</button>
  </div>
  <div class="overlay" id="gpanel"><div class="sheet"><div class="h2">Pet goals</div><div id="glist"></div><button class="close" data-close>Close</button></div></div>
  <div class="overlay" id="mpanel"><div class="sheet" style="text-align:center"><div class="h2">Town map</div><canvas id="mapcv" style="border-radius:16px;max-width:100%"></canvas><button class="close" data-close>Close</button></div></div>
  <div class="overlay" id="hpanel"><div class="sheet"><div class="h2">Hats</div><div class="hats" id="hlist"></div><button class="close" data-close>Close</button></div></div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){document.querySelector('.wrap').innerHTML='<p style="font-size:22px;padding:30px 10px">The 3D engine didn\'t load. Check the internet connection and reload the page.</p>';return}
const T=THREE,TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- Helpers ---------- */
const matC={};
const mat=(c,flat,emis)=>{const k=c+(flat?'f':'')+(emis||'');if(!matC[k]){matC[k]=new T.MeshLambertMaterial({color:c,flatShading:!!flat});if(emis)matC[k].emissive=new T.Color(emis)}return matC[k]};
const GEO={box:new T.BoxGeometry(1,1,1),sph:new T.SphereGeometry(1,20,14),cyl:new T.CylinderGeometry(1,1,1,18),cone:new T.ConeGeometry(1,1,18),ico:new T.IcosahedronGeometry(1,1),oct:new T.OctahedronGeometry(1,0),half:new T.SphereGeometry(1,18,8,0,TAU,0,Math.PI/2)};
function mesh(g,color,o={},parent){const m=new T.Mesh(GEO[g]||g,mat(color,o.flat,o.emis));m.position.set(o.x||0,o.y||0,o.z||0);m.scale.set(o.sx||1,o.sy||1,o.sz||1);m.rotation.set(o.rx||0,o.ry||0,o.rz||0);m.castShadow=o.cast!==false;m.receiveShadow=o.recv!==false;const pa=parent||scene;if(pa)pa.add(m);return m}
const lerpA=(a,b,t)=>{let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t};

/* ---------- Pets ---------- */
const PETS={
  cat:{n:'Cat',word:'kitty',noise:'Meow',e:'🐱',body:[.22,.2,.36],by:.42,head:.2,hp:[0,.68,.34],ear:'point',tail:'long',breeds:[
    {id:'shorthair',n:'Shorthair',colors:['#F2A65A','#9AA0AE','#46444F','#F4EEE4','#E2C9A6']},
    {id:'tabby',n:'Tabby',colors:['#E8A35E','#A3A3A8','#C9A27E'],pattern:['stripes'],eyeCol:'#9AC44A'},
    {id:'siamese',n:'Siamese',colors:['#F1E6D2','#E8E2DA'],pattern:['points'],eyeCol:'#4FA0F0'},
    {id:'persian',n:'Persian',colors:['#F7F3EE','#B9B4B9','#E9C08F'],body:[.26,.24,.36],head:.23,hp:[0,.72,.32],tail:'fluffy',snout:'flat',ear:'small',extra:['cheeks'],eyeCol:'#E3A33B'},
    {id:'mainecoon',n:'Maine Coon',colors:['#8A6248','#6E6A66','#C98A50'],body:[.26,.23,.44],by:.48,head:.22,hp:[0,.78,.42],ear:'tuft',tail:'fluffy',pattern:['stripes'],extra:['ruff'],eyeCol:'#9AC44A'},
    {id:'tuxedo',n:'Tuxedo',colors:['#2E2C34','#5A4A40'],pattern:['tux'],eyeCol:'#9AC44A'},
    {id:'sphynx',n:'Sphynx',colors:['#E9BBA8','#C9A7A0'],body:[.2,.18,.36],ear:'bat',tail:'thin',eyeCol:'#9AC44A'}]},
  dog:{n:'Dog',word:'puppy',noise:'Woof',e:'🐶',body:[.25,.22,.4],by:.44,head:.21,hp:[0,.72,.38],ear:'flop',tail:'wag',snout:'dog',breeds:[
    {id:'lab',n:'Labrador',colors:['#E8C27A','#3A3A42','#6B4A3A','#C8894F']},
    {id:'golden',n:'Golden Retriever',colors:['#E0A24E','#F0C98A'],tail:'feather',extra:['ruff']},
    {id:'dachshund',n:'Dachshund',colors:['#9A5A32','#3A2A24'],body:[.2,.17,.56],by:.3,head:.19,hp:[0,.5,.62],tail:'thin'},
    {id:'corgi',n:'Corgi',colors:['#E59A4A','#2F2B30'],body:[.25,.2,.42],by:.33,head:.21,hp:[0,.62,.44],ear:'big',tail:'stub',pattern:['blaze'],chest:1},
    {id:'dalmatian',n:'Dalmatian',colors:['#F7F5F0'],body:[.24,.21,.42],by:.5,hp:[0,.8,.4],pattern:['spots']},
    {id:'husky',n:'Husky',colors:['#7E8794','#3E3B40','#B8875A'],ear:'point',tail:'curl',pattern:['husky'],eyeCol:'#4FA0F0'},
    {id:'pug',n:'Pug',colors:['#E3C59A','#3A3A42'],body:[.23,.21,.32],by:.38,head:.22,hp:[0,.64,.3],snout:'pug',ear:'flop',earCol:'#2E2A30',tail:'curl'},
    {id:'poodle',n:'Poodle',colors:['#F7F3EE','#E9C9A4','#2F2B30'],body:[.2,.19,.34],by:.5,head:.18,hp:[0,.82,.32],tail:'pompom',extra:['puffs','topknot']}]},
  bunny:{n:'Bunny',word:'bunny',noise:'Squeak',e:'🐰',body:[.24,.24,.3],by:.32,head:.19,hp:[0,.6,.24],ear:'long',tail:'puff',breeds:[
    {id:'cottontail',n:'Cottontail',colors:['#F4EEE4','#C9A27E','#A8A8B5','#E8C7D4','#7A6150']},
    {id:'lop',n:'Lop',colors:['#C9A27E','#F4EEE4','#8A7A6E'],ear:'lop'},
    {id:'lionhead',n:'Lionhead',colors:['#E3C08F','#F4EEE4','#7A6150'],ear:'short',extra:['mane']},
    {id:'dutch',n:'Dutch',colors:['#3A3A42','#7A6150','#9AA0AE'],pattern:['dutch']}]},
  fox:{n:'Fox',word:'foxy',noise:'Yip',e:'🦊',body:[.2,.18,.38],by:.44,head:.19,hp:[0,.7,.36],ear:'big',tail:'bushy',snout:'fox',chest:1,breeds:[
    {id:'red',n:'Red Fox',colors:['#F07F3C','#C9562B','#8A5A3C']},
    {id:'arctic',n:'Arctic Fox',colors:['#F4F1EC','#B7B9C2'],ear:'point',extra:['ruff']},
    {id:'fennec',n:'Fennec Fox',colors:['#F1D7A8','#E6C28A'],ear:'huge',body:[.17,.15,.3],by:.36,head:.17,hp:[0,.58,.3]}]},
  hamster:{n:'Hamster',word:'hammy',noise:'Squeak',e:'🐹',body:[.26,.24,.3],by:.28,head:.18,hp:[0,.44,.22],ear:'round',tail:'none',breeds:[
    {id:'syrian',n:'Syrian',colors:['#E8B678','#D9895A','#C99A6B','#F4EEE4']},
    {id:'dwarf',n:'Dwarf',colors:['#9AA0AE','#C9B8A4'],body:[.22,.2,.26],by:.24,head:.16,hp:[0,.38,.19],pattern:['backstripe']},
    {id:'teddy',n:'Teddy Bear',colors:['#E8B678','#F4EEE4','#8A6248'],extra:['shaggy']}]}
};
const ORDER=Object.keys(PETS);
const NAMES={cat:'Whiskers',dog:'Biscuit',bunny:'Clover',fox:'Ember',hamster:'Peanut'};
function tint(hex,f){const c=new T.Color(hex);return '#'+(f<1?c.multiplyScalar(f):c.lerp(new T.Color('#ffffff'),f-1)).getHexString()}
const breedOf=(type,id)=>{const B=PETS[type].breeds;return B.find(b=>b.id===id)||B[0]};
const breedLabel=(type,id)=>breedOf(type,id).n+({cat:' cat',bunny:' bunny',hamster:' hamster'}[type]||'');
function buildPet(type,color,breedId){
  const P={...PETS[type],...breedOf(type,breedId)},pat=P.pattern||[],ex=P.extra||[];
  const col=color,dark=tint(color,.72),light=tint(color,1.6),stripe=tint(color,.5),white='#FBF8F2',point='#4A3A30';
  const isPoint=pat.includes('points'),isTux=pat.includes('tux'),isHusky=pat.includes('husky'),blaze=pat.includes('blaze');
  const bellyCol=(isTux||isHusky||blaze)?white:light,pawCol=(isTux||isHusky||blaze)?white:isPoint?point:light;
  const legCol=isPoint?point:col,earCol=isPoint?point:(P.earCol||col),tailCol=isPoint?point:col,snoutCol=(isTux||isHusky||blaze)?white:light;
  const root=new T.Group(),inner=new T.Group();root.add(inner);
  const [bx,byy,bz]=P.body;
  mesh('sph',col,{y:P.by,sx:bx,sy:byy,sz:bz},inner);
  if(pat.includes('dutch'))mesh('sph',white,{y:P.by,z:bz*.42,sx:bx*1.04,sy:byy*1.04,sz:bz*.6},inner);
  mesh('sph',bellyCol,{y:P.by-byy*(isHusky?.3:.4),z:.02,sx:bx*(isHusky?.86:.72),sy:byy*(isHusky?.72:.55),sz:bz*.8,cast:false},inner);
  if(P.chest||isTux||isHusky)mesh('sph',P.chest&&!blaze&&!isTux&&!isHusky?'#FBF6EE':white,{y:P.by+.03,z:bz*.72,sx:bx*.62,sy:byy*.75,sz:.11,cast:false},inner);

  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;
    o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(fr*slide,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}
}

}
function updateHumans(dt,now){

function nearestAction(){
  if(P.drive&&P.drive.fire&&!P.drive.helpCalled&&!FT)return {label:'🚒 Call the fire department',fn:()=>callFireDept(P.drive)};
  if(P.drive)return P.drive.broken?(RES?null:{label:'🚨 Call for help',fn:callRescue}):{label:'🚪 Get out',fn:exitVeh};
  if(P.nap>0)return null;
  const w=PETS[st.type].word;
  if(P.carry)return null;
  let best=null,bd=1e9;

  if(!FT)VEH.forEach(v=>{if(v.fire&&!v.helpCalled)consider(d2(v.x,v.z,P.x,P.z)-v.hl,4,'🚒 Call the fire department',()=>callFireDept(v))});
  if(P.y<1)VEH.forEach(v=>!v.burnt&&!v.fire&&consider(d2(v.x,v.z,P.x,P.z)-(v.bus?2.4:.9),1.8,v.bus?'🚌 Drive the bus':'🚗 Drive the car',()=>enterVeh(v)));

    if(h.snack&&(h.state==='walk'||h.state==='pet'))consider(d-.2,1.5,'🥪 Steal snack',()=>{const kind=h.snack;takeSnack(h);setCarry(kind);h.state='chase';h.t=7;h.shoutT=1;say(h,HL.steal(w,SNACKS[kind].split(' ')[1]),2000,'shout');shout();say(P,'Run!!',1200)});
    else if(h.state==='walk'&&h.cool<=0)consider(d,1.4,'🤸 Trip',()=>{const room=dir=>[.6,1.2,1.75].every(k=>!hits(h.x-Math.sin(h.a)*k*dir,h.z-Math.cos(h.a)*k*dir,0,.22));const away=(Math.sin(h.a)*(P.x-h.x)+Math.cos(h.a)*(P.z-h.z))>0?1:-1;h.fallDir=room(away)?away:0;if(!h.fallDir){const dx=P.x-h.x,dz=P.z-h.z,dn=Math.hypot(dx,dz)||1;if(dn<1.15){const nx=h.x+dx/dn*1.15,nz=h.z+dz/dn*1.15;if(!hits(nx,nz,P.y,.2)){P.x=nx;P.z=nz}}}h.state='fallen';h.t=2.2;h.cool=8;say(h,HL.trip(),1800,'shout');thud();
      if(h.snack){const kind=h.snack;takeSnack(h);const m=buildSnack(kind);m.position.set(h.x+Math.sin(h.a)*.9,.08,h.z+Math.cos(h.a)*.9);scene.add(m);DROPS.push({m,kind,x:m.position.x,z:m.position.z})}

    if(dp.respawn){dp.hidden=performance.now();dp.m.visible=false}else{scene.remove(dp.m);DROPS.splice(DROPS.indexOf(dp),1)}
    setCarry(dp.kind);const o=dp.owner&&dp.owner!=='baker'?HUM.find(h=>h.job===dp.owner):null;
    if(o&&o.state!=='fallen'){o.state='chase';o.t=7;o.shoutT=1;say(o,HL.steal(w,SNACKS[dp.kind].split(' ').slice(1).join(' ')),2000,'shout');shout();say(P,'Run!!',1200)}
    else{P.eatT=1.3;bump('steal');if(dp.owner==='baker')say(BAKER,'Hey, my bread! ...eh, I\'m too busy clicking.',2800)}})});

function updateWorld(dt,now){

  if(BAKER){const B=BAKER,r=B.rig;B.tapT-=dt;B.petCool-=dt;B.t-=dt;

  MAMA.t-=dt;if(MAMA.t<=0&&d2(MAMA.x,MAMA.z,P.x,P.z)<5&&st.ducks.length<3){say(MAMA,followers.length?'My babies!! Bring them here!':'Quack! My 3 ducklings are lost! Please find them!',3000);MAMA.t=8}
  CLOUDS.forEach(c=>{if(c.g){c.g.position.x+=c.v*dt;if(c.g.position.x>70)c.g.position.x=-70}if(c.swim){const a=t*.15+c.ph;c.swim.position.set(-18+Math.cos(a)*4.5,.02,18+Math.sin(a)*3.5);c.swim.rotation.y=-a}});
}
let inB=null;
function updateInside(){const b=BLD.find(b=>P.x>b.x0&&P.x<b.x1&&P.z>b.z0&&P.z<b.z1)||null;
  if(b!==inB){if(inB){inB.roof.visible=true;inB.wm.opacity=1;inB.wm.depthWrite=true}if(b){b.roof.visible=false;b.wm.opacity=.2;b.wm.depthWrite=false}inB=b}}

  updateInside();if(inB&&look.id===null)pitch+=(Math.max(pitch,.85)-pitch)*Math.min(1,dt*2);
  const CD=P.drive?(P.drive.bus?10:7):4.6;let dist=CD;const hgt=.8+pitch*3.2;

let last=performance.now(),saveT=0;
